name: Validate Civicomfy
on:
  push:
    branches:
      - development/**
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python syntax
        run: python -m compileall -q api downloader server utils tests config.py __init__.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
